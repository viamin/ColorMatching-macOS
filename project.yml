name: ColorMatching
options:
  bundleIdPrefix: com.viamin.colormatching
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release

packages:
  ColorComposerCore:
    path: ColorComposerCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_SIGNING_IDENTITY: "Developer ID Application"
    SIGNING_TEAM_ID: ""

targets:
  ColorMatching:
    type: application
    platform: macOS
    sources:
      - path: ColorMatching
        excludes:
          - "Info.plist"
          - "ColorMatching.entitlements"
          - "Assets.xcassets"
    resources:
      - path: ColorMatching/Assets.xcassets
    dependencies:
      - package: ColorComposerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viamin.colormatching.composer
        PRODUCT_MODULE_NAME: ColorMatching
        PRODUCT_NAME: Color Composer
        INFOPLIST_FILE: ColorMatching/Info.plist
        CODE_SIGN_ENTITLEMENTS: ColorMatching/ColorMatching.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(APP_SIGNING_IDENTITY)
          DEVELOPMENT_TEAM: $(SIGNING_TEAM_ID)
          ENABLE_HARDENED_RUNTIME: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          COPY_PHASE_STRIP: YES
          STRIP_INSTALLED_PRODUCT: YES
          VALIDATE_PRODUCT: YES
  ColorMatchingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ColorMatchingTests
    dependencies:
      - target: ColorMatching
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Color Composer.app/Contents/MacOS/Color Composer"

schemes:
  ColorMatching:
    build:
      targets:
        ColorMatching: all
    test:
      targets:
        - ColorMatchingTests
